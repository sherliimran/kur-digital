<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Pembayaran - Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f1f5f9;color:#222}
.header{background:#0057B8;color:#fff;padding:22px 20px;border-radius:0 0 25px 25px}.header h1{margin:0;font-size:24px}.header p{margin:7px 0 0}
.container{padding:20px;max-width:700px;margin:auto}.card{background:#fff;padding:20px;border-radius:18px;box-shadow:0 5px 15px rgba(0,0,0,.08);margin-bottom:18px}
.row{padding:13px 0;border-bottom:1px solid #ddd}.label{color:#777;font-size:13px;margin-bottom:5px}.value{font-size:17px;font-weight:bold}
.status{display:inline-block;padding:7px 12px;border-radius:20px;font-size:13px;font-weight:bold}.menunggu{background:#fff3cd;color:#856404}.diterima{background:#d1fae5;color:#065f46}.ditolak{background:#fee2e2;color:#991b1b}
.bukti{width:100%;max-height:450px;object-fit:contain;border-radius:12px;margin-top:10px;background:#f8fafc;border:1px solid #ddd}
.file-box{margin-top:10px;padding:12px;border-radius:10px;background:#f8fafc;border:1px solid #ddd;font-size:14px}
button{width:100%;border:0;padding:14px;border-radius:12px;color:#fff;font-size:16px;font-weight:bold;margin-top:10px;cursor:pointer}.verifikasi{background:#0057B8}.tolak{background:#d32f2f}.back{background:#555}
.empty{text-align:center;color:#777;padding:30px 10px}.info{background:#eef6ff;color:#174a7c;padding:12px;border-radius:10px;font-size:13px;line-height:1.5;margin-bottom:12px}.success{background:#d1fae5;color:#166534}.danger{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<div class="header"><h1>💳 Verifikasi Pembayaran</h1><p>Panel Admin KUR Digital</p></div>
<div class="container">
<div class="card"><div id="dataPembayaran"><div class="empty">Memuat data pembayaran...</div></div></div>
<button class="back" onclick="window.location.href='dashboard.html'">← Kembali ke Dashboard</button>
</div>

<script>
/* =========================================================
   VERIFIKASI PEMBAYARAN ADMIN - FINAL
   Kompatibel dengan bayar-angsuran.html yang menyimpan
   pembayaranAngsuran dan pembayaran sebagai ARRAY.
   ========================================================= */

function rupiah(angka){
    return "Rp " + Number(angka || 0).toLocaleString("id-ID");
}

function escapeHTML(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;").replace(/</g,"&lt;")
        .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function ambilPembayaran(){
    const keys=["pembayaranAngsuran","pembayaran"];
    for(const key of keys){
        try{
            const raw=localStorage.getItem(key);
            if(!raw) continue;
            const data=JSON.parse(raw);
            if(Array.isArray(data)) return data;
            if(data && typeof data==="object") return [data];
        }catch(e){console.error("Gagal membaca",key,e);}
    }
    return [];
}

function simpanPembayaran(data){
    const json=JSON.stringify(data);
    localStorage.setItem("pembayaranAngsuran",json);
    localStorage.setItem("pembayaran",json);
}

function catatAktivitas(judul,detail){
    let riwayat=[];
    try{
        riwayat=JSON.parse(localStorage.getItem("riwayatAktivitas"))||[];
        if(!Array.isArray(riwayat)) riwayat=[];
    }catch(e){riwayat=[];}
    riwayat.unshift({
        id:Date.now(),
        judul:judul,
        detail:detail,
        tanggal:new Date().toLocaleString("id-ID")
    });
    localStorage.setItem("riwayatAktivitas",JSON.stringify(riwayat));
}

function statusNormal(status){
    const s=String(status||"").toLowerCase().trim();
    if(s==="diverifikasi"||s==="disetujui"||s==="pembayaran berhasil diverifikasi")
        return "Pembayaran Berhasil Diverifikasi";
    if(s==="ditolak"||s==="pembayaran ditolak")
        return "Pembayaran Ditolak";
    return "Menunggu Verifikasi Admin";
}

function nomorAngsuran(item){
    const langsung=Number(item.angsuranKe||item.pembayaranKe||0);
    if(langsung>0) return langsung;
    const teks=item.angsuran||item.pembayaran||"";
    const hasil=String(teks).match(/\d+/);
    return hasil?Number(hasil[0]):1;
}

function tampilkanPembayaran(){
    const tempat=document.getElementById("dataPembayaran");
    const data=ambilPembayaran();

    if(data.length===0){
        tempat.innerHTML='<div class="empty">💳<br><br>Belum ada pembayaran yang dikirim nasabah.</div>';
        return;
    }

    /* Data terbaru berada di posisi pertama karena nasabah memakai unshift(). */
    const item=data[0];
    const status=statusNormal(item.status);
    const angsuranKe=nomorAngsuran(item);
    const jumlah=Number(item.jumlah||item.nominal||item.amount||0);
    const nomor=item.id?"PEM-"+item.id:"-";
    const angsuran=item.angsuran||item.pembayaran||("Angsuran ke-"+angsuranKe);

    let kelas="menunggu";
    if(status==="Pembayaran Berhasil Diverifikasi") kelas="diterima";
    if(status==="Pembayaran Ditolak") kelas="ditolak";

    let buktiHTML="";
    if(item.bukti && String(item.bukti).startsWith("data:image/")){
        buktiHTML='<img src="'+item.bukti+'" class="bukti" alt="Bukti Pembayaran">';
    }else if(item.bukti){
        buktiHTML='<div class="file-box">📎 '+escapeHTML(item.namaFile||item.bukti)+
        '<br><br><small>File tersimpan sebagai nama file. Gambar hanya dapat ditampilkan jika halaman nasabah menyimpan bukti sebagai data URL atau ke storage.</small></div>';
    }else{
        buktiHTML='<div class="file-box">Tidak ada bukti pembayaran.</div>';
    }

    let aksi="";
    if(status==="Menunggu Verifikasi Admin"){
        aksi='<button class="verifikasi" onclick="verifikasiPembayaran()">✓ Verifikasi Pembayaran</button>'+
             '<button class="tolak" onclick="tolakPembayaran()">✕ Tolak Pembayaran</button>';
    }else if(status==="Pembayaran Berhasil Diverifikasi"){
        aksi='<div class="info success">✓ Pembayaran ini sudah diverifikasi oleh Admin.<br><br>Pembayaran berikutnya: <b>Angsuran ke-'+(angsuranKe+1)+'</b></div>';
    }else{
        aksi='<div class="info danger">✕ Pembayaran ini telah ditolak.'+
             (item.alasanPenolakan?'<br><br><b>Alasan:</b> '+escapeHTML(item.alasanPenolakan):"")+
             '</div>';
    }

    tempat.innerHTML=
    '<div class="info"><b>Data Pembayaran Terbaru</b><br>Periksa bukti dan jumlah pembayaran sebelum melakukan verifikasi.</div>'+
    '<div class="row"><div class="label">Nomor Pembayaran</div><div class="value">'+escapeHTML(nomor)+'</div></div>'+
    '<div class="row"><div class="label">Nama Nasabah</div><div class="value">'+escapeHTML(item.nama||"Nasabah")+'</div></div>'+
    '<div class="row"><div class="label">Pembayaran</div><div class="value">'+escapeHTML(angsuran)+'</div></div>'+
    '<div class="row"><div class="label">Jumlah Pembayaran</div><div class="value">'+rupiah(jumlah)+'</div></div>'+
    '<div class="row"><div class="label">Rekening Pembayaran</div><div class="value">'+escapeHTML(item.rekening||item.rekeningPembayaran||"-")+'</div></div>'+
    '<div class="row"><div class="label">Tanggal Pengajuan</div><div class="value">'+escapeHTML(item.tanggal||"-")+'</div></div>'+
    '<div class="row"><div class="label">Status</div><div class="value"><span class="status '+kelas+'">'+escapeHTML(status)+'</span></div></div>'+
    '<div class="row"><div class="label">Bukti Pembayaran</div>'+buktiHTML+'</div>'+
    aksi;
}

function verifikasiPembayaran(){
    const data=ambilPembayaran();
    if(data.length===0){alert("Data pembayaran tidak ditemukan.");return;}

    const item=data[0];
    if(statusNormal(item.status)!=="Menunggu Verifikasi Admin"){
        alert("Pembayaran ini sudah diproses.");return;
    }

    const angsuranKe=nomorAngsuran(item);
    const jumlah=Number(item.jumlah||item.nominal||item.amount||0);

    if(!confirm("Verifikasi pembayaran ini?\n\nPembayaran: Angsuran ke-"+angsuranKe+"\nJumlah: "+rupiah(jumlah)))
        return;

    item.status="Pembayaran Berhasil Diverifikasi";
    item.diverifikasi=true;
    item.tanggalVerifikasi=new Date().toLocaleString("id-ID");
    item.angsuranKe=angsuranKe;
    item.pembayaranKe=angsuranKe;

    /* Kunci sinkronisasi dengan halaman nasabah. */
    localStorage.setItem("angsuranBerikutnya",String(angsuranKe+1));
    localStorage.setItem("pembayaranBerikutnya",String(angsuranKe+1));
    localStorage.setItem("statusPembayaranTerakhir","Pembayaran Berhasil Diverifikasi");
    localStorage.setItem("pesanPembayaran","Pembayaran angsuran ke-"+angsuranKe+" telah diverifikasi oleh Admin.");
    localStorage.setItem("statusAngsuran","Pembayaran ke-"+angsuranKe+" telah diverifikasi");
    localStorage.setItem("jumlahPembayaranSelesai",String(angsuranKe));

    simpanPembayaran(data);

    catatAktivitas(
        "Pembayaran Diverifikasi",
        "Pembayaran angsuran ke-"+angsuranKe+" sebesar "+rupiah(jumlah)+" telah diverifikasi."
    );

    alert("Pembayaran angsuran ke-"+angsuranKe+" berhasil diverifikasi.\n\nAngsuran berikutnya adalah ke-"+(angsuranKe+1)+".");
    tampilkanPembayaran();
}

function tolakPembayaran(){
    const data=ambilPembayaran();
    if(data.length===0){alert("Data pembayaran tidak ditemukan.");return;}

    const item=data[0];
    if(statusNormal(item.status)!=="Menunggu Verifikasi Admin"){
        alert("Pembayaran ini sudah diproses.");return;
    }

    const angsuranKe=nomorAngsuran(item);
    const alasan=prompt("Masukkan alasan penolakan pembayaran:");

    if(alasan===null) return;
    if(!alasan.trim()){alert("Alasan penolakan wajib diisi.");return;}

    item.status="Pembayaran Ditolak";
    item.diverifikasi=false;
    item.tanggalVerifikasi=new Date().toLocaleString("id-ID");
    item.alasanPenolakan=alasan.trim();
    item.angsuranKe=angsuranKe;
    item.pembayaranKe=angsuranKe;

    localStorage.setItem("statusPembayaranTerakhir","Pembayaran Ditolak");
    localStorage.setItem(
        "pesanPembayaran",
        "Pembayaran angsuran ke-"+angsuranKe+" ditolak. "+alasan.trim()
    );

    /* Karena ditolak, angsuran tetap pada nomor yang sama. */
    localStorage.setItem("angsuranBerikutnya",String(angsuranKe));
    localStorage.setItem("pembayaranBerikutnya",String(angsuranKe));

    simpanPembayaran(data);

    catatAktivitas(
        "Pembayaran Ditolak",
        "Pembayaran angsuran ke-"+angsuranKe+" ditolak. Alasan: "+alasan.trim()
    );

    alert("Pembayaran angsuran ke-"+angsuranKe+" berhasil ditolak.");
    tampilkanPembayaran();
}

function cekLoginAdmin(){
    if(localStorage.getItem("adminLogin")!=="true"){
        window.location.href="login.html";
        return false;
    }
    return true;
}

if(cekLoginAdmin()){
    tampilkanPembayaran();
}
</script>
</body>
</html>
