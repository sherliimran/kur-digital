<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#0057B8"
>

<title>Pengajuan KUR - Admin</title>

<link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet"
>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f5f9;
    color:#1f2937;
}


/* =========================
   HEADER
========================= */

.header{
    background:#0057B8;
    color:white;
    padding:22px 18px;
    border-radius:0 0 24px 24px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1100px;
    margin:auto;
}

.header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.header h1{
    margin:0;
    font-size:24px;
}

.header p{
    margin:7px 0 0;
    font-size:13px;
    opacity:.9;
}

.header-actions{
    display:flex;
    gap:8px;
}

.header-btn{
    border:0;
    background:rgba(255,255,255,.16);
    color:white;
    width:42px;
    height:42px;
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
}

.header-btn:active{
    transform:scale(.95);
}


/* =========================
   CONTAINER
========================= */

.container{
    max-width:1100px;
    margin:auto;
    padding:20px 14px 50px;
}


/* =========================
   STATISTIK
========================= */

.stats{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat-card{
    background:white;
    border-radius:15px;
    padding:17px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.stat-label{
    color:#6b7280;
    font-size:12px;
    margin-bottom:7px;
}

.stat-value{
    font-size:25px;
    font-weight:bold;
    color:#0057B8;
}


/* =========================
   CARD
========================= */

.card{
    background:white;
    border-radius:17px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.title{
    margin:0 0 15px;
    color:#0057B8;
    font-size:19px;
}


/* =========================
   FILTER
========================= */

.filter-row{
    display:grid;
    grid-template-columns:
        1fr 220px auto;
    gap:10px;
}

input,
select{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:10px;
    padding:12px;
    font-size:14px;
    outline:none;
    background:white;
}

input:focus,
select:focus{
    border-color:#0057B8;
    box-shadow:
        0 0 0 3px
        rgba(0,87,184,.08);
}

.btn{
    border:0;
    border-radius:10px;
    padding:12px 16px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.btn-blue{
    background:#0057B8;
    color:white;
}

.btn-gray{
    background:#e5e7eb;
    color:#374151;
}

.btn-green{
    background:#16a34a;
    color:white;
}

.btn-red{
    background:#dc2626;
    color:white;
}


/* =========================
   LIST
========================= */

.list-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.jumlah-info{
    color:#6b7280;
    font-size:13px;
}


/* =========================
   ITEM PENGAJUAN
========================= */

.pengajuan{
    border:1px solid #e5e7eb;
    border-radius:15px;
    margin-bottom:13px;
    overflow:hidden;
    background:white;
}

.pengajuan-top{
    padding:16px;
    background:#f8fafc;
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
}

.pengajuan-nomor{
    font-size:13px;
    color:#0057B8;
    font-weight:bold;
}

.pengajuan-nama{
    font-size:18px;
    font-weight:bold;
    margin-top:5px;
}

.pengajuan-tanggal{
    color:#6b7280;
    font-size:12px;
    margin-top:5px;
}


/* =========================
   STATUS
========================= */

.status{
    display:inline-block;
    padding:7px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}

.status-menunggu{
    background:#fff3cd;
    color:#856404;
}

.status-proses{
    background:#dbeafe;
    color:#1e40af;
}

.status-survey{
    background:#ede9fe;
    color:#6d28d9;
}

.status-setuju{
    background:#dcfce7;
    color:#166534;
}

.status-cair{
    background:#bbf7d0;
    color:#166534;
}

.status-tolak{
    background:#fee2e2;
    color:#991b1b;
}


/* =========================
   SUMMARY
========================= */

.summary{
    padding:15px;
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:10px;
}

.summary-item{
    background:#f8fafc;
    border-radius:10px;
    padding:12px;
}

.summary-label{
    color:#6b7280;
    font-size:11px;
}

.summary-value{
    font-size:14px;
    font-weight:bold;
    margin-top:4px;
    word-break:break-word;
}


/* =========================
   PROGRESS
========================= */

.progress-wrap{
    padding:0 15px 15px;
}

.progress-bg{
    width:100%;
    height:16px;
    border-radius:20px;
    background:#e5e7eb;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:#0057B8;
    color:white;
    font-size:10px;
    line-height:16px;
    text-align:center;
    transition:.3s;
}


/* =========================
   ACTION
========================= */

.action-row{
    padding:0 15px 15px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.action-row .btn{
    flex:1;
    min-width:130px;
}


/* =========================
   DETAIL
========================= */

.detail{
    display:none;
    border-top:1px solid #e5e7eb;
    padding:15px;
    background:#fff;
}

.detail.active{
    display:block;
}

.detail-title{
    color:#0057B8;
    font-weight:bold;
    margin-bottom:12px;
}

.detail-grid{
    display:grid;
    grid-template-columns:
        1fr 1fr;
    gap:10px;
}

.detail-item{
    background:#f8fafc;
    border-radius:10px;
    padding:11px;
}

.detail-label{
    font-size:11px;
    color:#6b7280;
    margin-bottom:4px;
}

.detail-value{
    font-size:13px;
    font-weight:bold;
    word-break:break-word;
}


/* =========================
   MODAL
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:9999;
    padding:20px;
    overflow:auto;
}

.modal.active{
    display:flex;
    align-items:center;
    justify-content:center;
}

.modal-box{
    width:100%;
    max-width:750px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:18px;
    padding:20px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.modal-title{
    margin:0;
    color:#0057B8;
}

.close-btn{
    border:0;
    background:#eee;
    width:38px;
    height:38px;
    border-radius:50%;
    cursor:pointer;
}


/* =========================
   EMPTY / LOADING
========================= */

.empty{
    text-align:center;
    color:#6b7280;
    padding:40px 15px;
}

.loading{
    text-align:center;
    padding:40px;
    color:#6b7280;
}

.spinner{
    width:35px;
    height:35px;
    border:4px solid #e5e7eb;
    border-top-color:#0057B8;
    border-radius:50%;
    margin:0 auto 12px;
    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================
   ALERT
========================= */

.alert{
    display:none;
    padding:13px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:13px;
}

.alert.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.alert.success{
    display:block;
    background:#dcfce7;
    color:#166534;
    border:1px solid #bbf7d0;
}


/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;
    color:#6b7280;
    font-size:11px;
    padding:20px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

    .filter-row{
        grid-template-columns:1fr;
    }

    .summary{
        grid-template-columns:
            1fr 1fr;
    }

}


@media(max-width:600px){

    .header-top{
        align-items:flex-start;
    }

    .header h1{
        font-size:21px;
    }

    .pengajuan-top{
        flex-direction:column;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .stats{
        gap:8px;
    }

    .stat-card{
        padding:13px;
    }

    .stat-value{
        font-size:21px;
    }

}

</style>

</head>

<script>

/* =========================================================
   KUR DIGITAL
   ADMIN PENGAJUAN
   BACA SEMUA DATA SUPABASE
========================================================= */


/* =========================================================
   1. KONFIGURASI
========================================================= */

const SUPABASE_URL =
    "https://binojniwitsdhnhqmneq.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_yX4gQ30MAXnmrVAUIL1bZQ_f6E1hnNV";


const SUPABASE_TABLE =
    "pengajuan";


/* =========================================================
   2. VARIABEL
========================================================= */

let supabaseClient = null;

let semuaPengajuan = [];


/* =========================================================
   3. LOAD SUPABASE
========================================================= */

function loadSupabaseLibrary(){

    return new Promise(
        function(resolve,reject){

            if(
                window.supabase &&
                typeof window.supabase.createClient ===
                "function"
            ){

                resolve();

                return;

            }


            const script =
                document.createElement("script");


            script.src =
                "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";


            script.onload =
                function(){

                    if(
                        window.supabase &&
                        typeof window.supabase.createClient ===
                        "function"
                    ){

                        resolve();

                    }else{

                        reject(
                            new Error(
                                "Library Supabase gagal dimuat."
                            )
                        );

                    }

                };


            script.onerror =
                function(){

                    reject(
                        new Error(
                            "Tidak dapat memuat Supabase."
                        )
                    );

                };


            document.head.appendChild(script);

        }
    );

}


/* =========================================================
   4. INIT
========================================================= */

async function initSupabase(){

    await loadSupabaseLibrary();


    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

}


/* =========================================================
   5. ESCAPE HTML
========================================================= */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "-";

    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   6. FORMAT RUPIAH
========================================================= */

function rupiah(value){

    const angka =
        Number(value || 0);


    return "Rp " +
        angka.toLocaleString("id-ID");

}


/* =========================================================
   7. FORMAT TANGGAL
========================================================= */

function formatTanggal(value){

    if(!value){

        return "-";

    }


    try{

        return new Date(value)
            .toLocaleString(
                "id-ID",
                {
                    dateStyle:"medium",
                    timeStyle:"short"
                }
            );

    }catch(error){

        return value;

    }

}


/* =========================================================
   8. STATUS CLASS
========================================================= */

function statusClass(status){

    const s =
        String(status || "")
        .toLowerCase();


    if(
        s.includes("menunggu")
    ){

        return "status-menunggu";

    }


    if(
        s.includes("verifikasi")
    ){

        return "status-proses";

    }


    if(
        s.includes("survey")
    ){

        return "status-survey";

    }


    if(
        s.includes("persetujuan")
    ){

        return "status-setuju";

    }


    if(
        s.includes("cair")
    ){

        return "status-cair";

    }


    if(
        s.includes("tolak")
    ){

        return "status-tolak";

    }


    return "status-proses";

}


/* =========================================================
   9. ALERT
========================================================= */

function tampilkanAlert(
    pesan,
    tipe
){

    const box =
        document.getElementById(
            "alertBox"
        );


    box.className =
        "alert " +
        tipe;


    box.innerHTML =
        pesan;


    setTimeout(
        function(){

            box.className =
                "alert";

        },
        5000
    );

}


/* =========================================================
   10. AMBIL SEMUA DATA SUPABASE
========================================================= */

async function muatSemuaPengajuan(){

    const daftar =
        document.getElementById(
            "daftarPengajuan"
        );


    daftar.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Mengambil semua data dari Supabase...

        </div>

    `;


    try{

        if(!supabaseClient){

            await initSupabase();

        }


        console.log(
            "Mengambil semua data dari tabel:",
            SUPABASE_TABLE
        );


        /*
         * PENTING:
         * select("*") berarti membaca
         * semua kolom yang tersedia
         * pada tabel pengajuan.
         */

        const hasil =
            await supabaseClient
            .from(SUPABASE_TABLE)
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(hasil.error){

            console.error(
                "SUPABASE ERROR:",
                hasil.error
            );


            throw new Error(
                hasil.error.message
            );

        }


        semuaPengajuan =
            Array.isArray(
                hasil.data
            )
            ?
            hasil.data
            :
            [];


        console.log(
            "Jumlah pengajuan dari Supabase:",
            semuaPengajuan.length
        );


        updateStatistik();


        renderPengajuan();


    }catch(error){

        console.error(
            "Gagal membaca Supabase:",
            error
        );


        semuaPengajuan = [];


        daftar.innerHTML = `

            <div class="empty">

                <b>Gagal membaca data Supabase.</b>

                <br><br>

                ${escapeHtml(error.message)}

                <br><br>

                <button
                    class="btn btn-blue"
                    onclick="muatSemuaPengajuan()"
                >
                    Coba Lagi
                </button>

            </div>

        `;


        tampilkanAlert(
            "Gagal mengambil data Supabase: " +
            escapeHtml(error.message),
            "error"
        );

    }

}


/* =========================================================
   11. STATISTIK
========================================================= */

function updateStatistik(){

    const total =
        semuaPengajuan.length;


    const menunggu =
        semuaPengajuan.filter(
            function(p){

                return String(
                    p.status || ""
                ).toLowerCase()
                .includes("menunggu");

            }
        ).length;


    const proses =
        semuaPengajuan.filter(
            function(p){

                const s =
                    String(
                        p.status || ""
                    ).toLowerCase();


                return (
                    s.includes("verifikasi") ||
                    s.includes("survey") ||
                    s.includes("persetujuan")
                );

            }
        ).length;


    const cair =
        semuaPengajuan.filter(
            function(p){

                return String(
                    p.status || ""
                ).toLowerCase()
                .includes("cair");

            }
        ).length;


    document.getElementById(
        "totalPengajuan"
    ).innerText =
        total;


    document.getElementById(
        "totalMenunggu"
    ).innerText =
        menunggu;


    document.getElementById(
        "totalProses"
    ).innerText =
        proses;


    document.getElementById(
        "totalCair"
    ).innerText =
        cair;

}


/* =========================================================
   12. FILTER + RENDER
========================================================= */

function renderPengajuan(){

    const daftar =
        document.getElementById(
            "daftarPengajuan"
        );


    const keyword =
        document.getElementById(
            "inputCari"
        ).value
        .trim()
        .toLowerCase();


    const filter =
        document.getElementById(
            "filterStatus"
        ).value;


    const hasil =
        semuaPengajuan.filter(
            function(p){

                const teks = (

                    (p.nama || "") +
                    " " +
                    (p.nik || "") +
                    " " +
                    (p.nomor_pengajuan || "") +
                    " " +
                    (p.hp || "") +
                    " " +
                    (p.usaha || "")

                ).toLowerCase();


                const cocokCari =
                    !keyword ||
                    teks.includes(keyword);


                const cocokStatus =
                    !filter ||
                    String(p.status || "") ===
                    filter;


                return (
                    cocokCari &&
                    cocokStatus
                );

            }
        );


    document.getElementById(
        "jumlahTampil"
    ).innerText =
        hasil.length +
        " pengajuan ditampilkan dari " +
        semuaPengajuan.length +
        " total";


    if(!hasil.length){

        daftar.innerHTML = `

            <div class="empty">

                Tidak ada pengajuan yang sesuai.

            </div>

        `;

        return;

    }


    daftar.innerHTML =
        hasil
        .map(
            function(p){

                return buatKartuPengajuan(p);

            }
        )
        .join("");

}


/* =========================================================
   13. BUAT KARTU
========================================================= */

function buatKartuPengajuan(p){

    const id =
        escapeHtml(
            p.id || ""
        );


    const nomor =
        escapeHtml(
            p.nomor_pengajuan ||
            "-"
        );


    const nama =
        escapeHtml(
            p.nama ||
            "-"
        );


    const status =
        escapeHtml(
            p.status ||
            "Menunggu Verifikasi"
        );


    const progress =
        Math.max(
            0,
            Math.min(
                100,
                Number(
                    p.progress || 0
                )
            )
        );


    const jumlah =
        rupiah(
            p.jumlah_pinjaman
        );


    const tanggal =
        formatTanggal(
            p.created_at
        );


    return `

        <div
            class="pengajuan"
            id="pengajuan-${id}"
        >

            <div class="pengajuan-top">

                <div>

                    <div class="pengajuan-nomor">

                        ${nomor}

                    </div>

                    <div class="pengajuan-nama">

                        ${nama}

                    </div>

                    <div class="pengajuan-tanggal">

                        ${tanggal}

                    </div>

                </div>


                <span
                    class="status ${statusClass(status)}"
                >

                    ${status}

                </span>

            </div>


            <div class="summary">


                <div class="summary-item">

                    <div class="summary-label">
                        NIK
                    </div>

                    <div class="summary-value">
                        ${escapeHtml(p.nik || "-")}
                    </div>

                </div>


                <div class="summary-item">

                    <div class="summary-label">
                        HP
                    </div>

                    <div class="summary-value">
                        ${escapeHtml(p.hp || "-")}
                    </div>

                </div>


                <div class="summary-item">

                    <div class="summary-label">
                        Jumlah Pinjaman
                    </div>

                    <div class="summary-value">
                        ${jumlah}
                    </div>

                </div>


                <div class="summary-item">

                    <div class="summary-label">
                        Tenor
                    </div>

                    <div class="summary-value">
                        ${escapeHtml(p.tenor || "-")}
                        Bulan
                    </div>

                </div>


            </div>


            <div class="progress-wrap">

                <div class="progress-bg">

                    <div
                        class="progress-bar"
                        style="width:${progress}%"
                    >

                        ${progress}%

                    </div>

                </div>

            </div>


            <div class="action-row">


                <button
                    class="btn btn-blue"
                    onclick="lihatDetail('${id}')"
                >

                    <span
                        class="material-icons"
                        style="vertical-align:middle;font-size:17px;"
                    >
                        visibility
                    </span>

                    Detail

                </button>


                <button
                    class="btn btn-green"
                    onclick="ubahStatusSupabase('${id}',40,'Verifikasi Dokumen')"
                >

                    Verifikasi

                </button>


                <button
                    class="btn btn-gray"
                    onclick="ubahStatusSupabase('${id}',60,'Survey Lapangan')"
                >

                    Survey

                </button>


                <button
                    class="btn btn-red"
                    onclick="ubahStatusSupabase('${id}',0,'Pengajuan Ditolak')"
                >

                    Tolak

                </button>


            </div>


            <div
                class="detail"
                id="detail-${id}"
            >

                ${buatDetailHtml(p)}

            </div>

        </div>

    `;

}


/* =========================================================
   14. DETAIL HTML
========================================================= */

function buatDetailHtml(p){

    /*
     * Daftar ini membaca kolom-kolom
     * utama yang digunakan aplikasi.
     *
     * Jika kolom tambahan ada di Supabase,
     * akan tetap ditampilkan di bagian
     * "Semua Kolom Supabase".
     */

    const kolomUtama = [

        ["ID",p.id],

        ["Nomor Pengajuan",p.nomor_pengajuan],

        ["Nama Lengkap",p.nama],

        ["NIK",p.nik],

        ["Nomor HP",p.hp],

        ["Alamat",p.alamat],

        ["Nama Bank",p.namaBank ?? p.nama_bank],

        ["Nomor Rekening",
            p.nomorRekening ??
            p.nomor_rekening],

        ["Nama Pemilik Rekening",
            p.namaPemilikRekening ??
            p.nama_pemilik_rekening],

        ["Nama Usaha",p.usaha],

        ["Jenis Usaha",p.jenis_usaha],

        ["Lama Usaha",
            p.lama_usaha !== undefined
            ?
            p.lama_usaha + " Tahun"
            :
            null],

        ["Penghasilan",
            p.penghasilan !== undefined
            ?
            rupiah(p.penghasilan)
            :
            null],

        ["Jenis Pinjaman",
            p.jenis_pinjaman],

        ["Jumlah Pinjaman",
            p.jumlah_pinjaman !== undefined
            ?
            rupiah(p.jumlah_pinjaman)
            :
            null],

        ["Tenor",
            p.tenor !== undefined
            ?
            p.tenor + " Bulan"
            :
            null],

        ["Status",p.status],

        ["Progress",
            p.progress !== undefined
            ?
            p.progress + "%"
            :
            null],

        ["Sudah Dicairkan",
            p.sudah_dicairkan !== undefined
            ?
            (
                p.sudah_dicairkan
                ?
                "Ya"
                :
                "Belum"
            )
            :
            null],

        ["Dibuat",
            formatTanggal(p.created_at)],

        ["Diperbarui",
            formatTanggal(p.updated_at)]

    ];


    let html = `

        <div class="detail-title">
            Data Pengajuan
        </div>

        <div class="detail-grid">

    `;


    kolomUtama.forEach(
        function(item){

            const label =
                item[0];


            const value =
                item[1];


            if(
                value !== null &&
                value !== undefined &&
                value !== ""
            ){

                html += `

                    <div class="detail-item">

                        <div class="detail-label">
                            ${escapeHtml(label)}
                        </div>

                        <div class="detail-value">
                            ${escapeHtml(value)}
                        </div>

                    </div>

                `;

            }

        }
    );


    html += `

        </div>

    `;


    /*
     * SEMUA KOLOM TAMBAHAN
     */

    const kolomSudah =
        new Set([

            "id",
            "nomor_pengajuan",
            "nama",
            "nik",
            "hp",
            "alamat",
            "namaBank",
            "nama_bank",
            "nomorRekening",
            "nomor_rekening",
            "namaPemilikRekening",
            "nama_pemilik_rekening",
            "usaha",
            "jenis_usaha",
            "lama_usaha",
            "penghasilan",
            "jenis_pinjaman",
            "jumlah_pinjaman",
            "tenor",
            "status",
            "progress",
            "sudah_dicairkan",
            "created_at",
            "updated_at"

        ]);


    const tambahan =
        Object.keys(p)
        .filter(
            function(key){

                return !kolomSudah.has(key);

            }
        );


    if(tambahan.length){

        html += `

            <div
                class="detail-title"
                style="margin-top:20px;"
            >

                Semua Kolom Tambahan Supabase

            </div>

            <div class="detail-grid">

        `;


        tambahan.forEach(
            function(key){

                let value =
                    p[key];


                if(
                    value &&
                    typeof value === "object"
                ){

                    try{

                        value =
                            JSON.stringify(
                                value
                            );

                    }catch(e){

                        value =
                            String(value);

                    }

                }


                html += `

                    <div class="detail-item">

                        <div class="detail-label">

                            ${escapeHtml(key)}

                        </div>

                        <div class="detail-value">

                            ${escapeHtml(value)}

                        </div>

                    </div>

                `;

            }
        );


        html += `

            </div>

        `;

    }


    return html;

}


/* =========================================================
   15. LIHAT DETAIL
========================================================= */

function lihatDetail(id){

    const p =
        semuaPengajuan.find(
            function(item){

                return String(item.id) ===
                    String(id);

            }
        );


    if(!p){

        alert(
            "Data pengajuan tidak ditemukan."
        );

        return;

    }


    const detail =
        document.getElementById(
            "detail-" + id
        );


    if(detail){

        detail.classList.toggle(
            "active"
        );

    }

}


/* =========================================================
   16. MODAL DETAIL LENGKAP
========================================================= */

function bukaDetailModal(id){

    const p =
        semuaPengajuan.find(
            function(item){

                return String(item.id) ===
                    String(id);

            }
        );


    if(!p){

        return;

    }


    document.getElementById(
        "isiDetail"
    ).innerHTML =
        buatDetailHtml(p);


    document.getElementById(
        "modalDetail"
    ).classList.add(
        "active"
    );

}


function tutupDetail(){

    document.getElementById(
        "modalDetail"
    ).classList.remove(
        "active"
    );

}


/* =========================================================
   17. UPDATE STATUS SUPABASE
========================================================= */

async function ubahStatusSupabase(
    id,
    progress,
    status
){

    const p =
        semuaPengajuan.find(
            function(item){

                return String(item.id) ===
                    String(id);

            }
        );


    if(!p){

        alert(
            "Data pengajuan tidak ditemukan."
        );

        return;

    }


    const yakin =
        confirm(
            "Ubah status pengajuan " +
            (p.nomor_pengajuan || "") +
            " menjadi:\n\n" +
            status +
            "\nProgress: " +
            progress +
            "%"
        );


    if(!yakin){

        return;

    }


    try{

        if(!supabaseClient){

            await initSupabase();

        }


        const updateData = {

            status:
                status,

            progress:
                progress,

            updated_at:
                new Date().toISOString()

        };


        /*
         * Jika 100%, tandai sudah dicairkan.
         */

        if(progress === 100){

            updateData.sudah_dicairkan =
                true;

        }


        const hasil =
            await supabaseClient
            .from(SUPABASE_TABLE)
            .update(updateData)
            .eq("id",id)
            .select()
            .single();


        if(hasil.error){

            throw new Error(
                hasil.error.message
            );

        }


        /*
         * Update array lokal
         * supaya tampilan langsung berubah.
         */

        const index =
            semuaPengajuan.findIndex(
                function(item){

                    return String(item.id) ===
                        String(id);

                }
            );


        if(index !== -1){

            semuaPengajuan[index] =
                hasil.data;

        }


        updateStatistik();

        renderPengajuan();


        tampilkanAlert(
            "Status berhasil diperbarui di Supabase.",
            "success"
        );


    }catch(error){

        console.error(
            "Gagal update status:",
            error
        );


        tampilkanAlert(
            "Gagal memperbarui status: " +
            escapeHtml(error.message),
            "error"
        );

    }

}
