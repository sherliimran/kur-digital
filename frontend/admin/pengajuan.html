<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Pengajuan KUR - Admin</title>

<link rel="stylesheet"
      href="../css/admin.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f5f9;
    color:#1f2937;
}

.header{
    background:#0057B8;
    color:white;
    padding:22px 20px;
    border-radius:0 0 25px 25px;
}

.header-inner{
    max-width:900px;
    margin:auto;
}

.header h1{
    margin:0;
    font-size:25px;
}

.header p{
    margin:7px 0 0;
    opacity:.9;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px 14px 50px;
}

.card{
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.title{
    color:#0057B8;
    margin-top:0;
}


/* =========================
   TOOLBAR
========================= */

.toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.toolbar button{
    border:0;
    border-radius:10px;
    padding:11px 15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-refresh{
    background:#0057B8;
    color:white;
}

.btn-dashboard{
    background:#555;
    color:white;
}


/* =========================
   JUMLAH DATA
========================= */

.jumlah{
    background:#eef6ff;
    border:1px solid #bfdbfe;
    color:#174a7c;
    border-radius:12px;
    padding:13px;
    margin-bottom:15px;
    font-size:14px;
}


/* =========================
   LIST PENGAJUAN
========================= */

.list-item{
    border:1px solid #e2e8f0;
    border-radius:14px;
    padding:15px;
    margin-bottom:12px;
    cursor:pointer;
    transition:.2s;
}

.list-item:hover{
    border-color:#0057B8;
    box-shadow:0 3px 10px rgba(0,87,184,.1);
}

.list-item.active{
    border:2px solid #0057B8;
    background:#f8fbff;
}

.list-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.list-name{
    font-size:17px;
    font-weight:bold;
    color:#111827;
}

.list-number{
    color:#0057B8;
    font-size:12px;
    margin-top:5px;
    font-weight:bold;
}

.list-date{
    font-size:11px;
    color:#777;
    margin-top:5px;
}

.status{
    display:inline-block;
    padding:7px 10px;
    border-radius:20px;
    background:#fff3cd;
    color:#856404;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}


/* =========================
   DETAIL
========================= */

.detail{
    display:none;
}

.detail.show{
    display:block;
}

.row{
    padding:13px 0;
    border-bottom:1px solid #e5e7eb;
}

.label{
    color:#777;
    font-size:13px;
    margin-bottom:5px;
}

.value{
    font-size:16px;
    font-weight:bold;
    word-break:break-word;
}

.section-mini{
    color:#0057B8;
    font-weight:bold;
    font-size:16px;
    margin:20px 0 5px;
}


/* =========================
   PROGRESS
========================= */

.progress-box{
    margin-top:20px;
}

.progress-bg{
    width:100%;
    height:20px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#0057B8;
    color:white;
    text-align:center;
    line-height:20px;
    font-size:11px;
    transition:.3s;
}


/* =========================
   ACTIONS
========================= */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.actions button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    color:white;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.btn20{
    background:#6b7280;
}

.btn40{
    background:#0057B8;
}

.btn60{
    background:#f59e0b;
}

.btn80{
    background:#7c3aed;
}

.btn100{
    background:#16a34a;
}

.btnTolak{
    background:#dc2626;
}


/* =========================
   INFO / PESAN
========================= */

.info{
    background:#eef6ff;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
    color:#174a7c;
    line-height:1.5;
}

.message{
    display:none;
    padding:13px;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.5;
    font-size:13px;
}

.message.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.message.success{
    display:block;
    background:#dcfce7;
    color:#166534;
    border:1px solid #bbf7d0;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

.loading{
    text-align:center;
    color:#0057B8;
    padding:25px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    .container{
        padding:14px 12px 40px;
    }

    .card{
        padding:16px;
    }

    .list-top{
        flex-direction:column;
    }

    .actions{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>

<div class="card">

</main>


<script>

/* =========================================================
   KUR DIGITAL
   ADMIN PENGAJUAN
   SUPABASE VERSION
========================================================= */


/* =========================================================
   1. SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://binojniwitsdhnhqmneq.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_yX4gQ30MAXnmrVAUIL1bZQ_f6E1hnNV";


const SUPABASE_TABLE =
    "pengajuan";


let supabaseClient = null;


/* =========================================================
   2. DATA
========================================================= */

let semuaPengajuan = [];

let pengajuanTerpilih = null;


/* =========================================================
   3. LOAD SUPABASE
========================================================= */

function loadSupabaseLibrary(){

    return new Promise(
        function(resolve,reject){

            if(
                window.supabase &&
                typeof window.supabase.createClient ===
                "function"
            ){

                resolve();

                return;

            }


            const script =
                document.createElement("script");


            script.src =
                "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";


            script.onload =
                function(){

                    if(
                        window.supabase &&
                        typeof window.supabase.createClient ===
                        "function"
                    ){

                        resolve();

                    }else{

                        reject(
                            new Error(
                                "Library Supabase tidak berhasil dimuat."
                            )
                        );

                    }

                };


            script.onerror =
                function(){

                    reject(
                        new Error(
                            "Gagal memuat library Supabase."
                        )
                    );

                };


            document.head.appendChild(script);

        }
    );

}


/* =========================================================
   4. INIT
========================================================= */

async function initSupabase(){

    await loadSupabaseLibrary();


    supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

}


/* =========================================================
   5. PESAN
========================================================= */

function tampilkanPesan(
    teks,
    tipe
){

    const box =
        document.getElementById("pesan");


    box.className =
        "message " + tipe;


    box.innerHTML =
        teks;


    box.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });


}


/* =========================================================
   6. FORMAT RUPIAH
========================================================= */

function formatRupiah(
    angka
){

    return "Rp " +
        Number(
            angka || 0
        ).toLocaleString(
            "id-ID"
        );

}


/* =========================================================
   7. FORMAT TANGGAL
========================================================= */

function formatTanggal(
    tanggal
){

    if(!tanggal){

        return "-";

    }


    try{

        return new Date(
            tanggal
        ).toLocaleString(
            "id-ID"
        );

    }catch(e){

        return tanggal;

    }

}


/* =========================================================
   8. ESCAPE HTML
========================================================= */

function escapeHTML(
    nilai
){

    if(
        nilai === null ||
        nilai === undefined
    ){

        return "-";

    }


    return String(nilai)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   9. AMBIL SEMUA PENGAJUAN DARI SUPABASE
========================================================= */

async function muatSemuaPengajuan(){

    const daftar =
        document.getElementById(
            "daftarPengajuan"
        );


    const jumlah =
        document.getElementById(
            "jumlahPengajuan"
        );


    daftar.innerHTML = `
        <div class="loading">
            ⏳ Mengambil semua pengajuan dari Supabase...
        </div>
    `;


    jumlah.innerHTML =
        "Memuat data...";


    try{

        if(!supabaseClient){

            await initSupabase();

        }


        const hasil =
            await supabaseClient
                .from(SUPABASE_TABLE)
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(hasil.error){

            console.error(
                "SUPABASE SELECT ERROR:",
                hasil.error
            );


            throw new Error(
                hasil.error.message ||
                "Gagal mengambil data pengajuan."
            );

        }


        semuaPengajuan =
            hasil.data || [];


        console.log(
            "Semua pengajuan:",
            semuaPengajuan
        );


        jumlah.innerHTML =
            "📋 Total pengajuan: <b>" +
            semuaPengajuan.length +
            "</b>";


        tampilkanDaftar();


    }catch(error){

        console.error(
            error
        );


        daftar.innerHTML = `
            <div class="empty">
                ❌ Gagal mengambil data pengajuan.<br><br>
                ${escapeHTML(error.message)}
            </div>
        `;


        jumlah.innerHTML =
            "Gagal memuat data.";


        tampilkanPesan(
            "Gagal mengambil data dari Supabase.<br><br>" +
            escapeHTML(error.message),
            "error"
        );

    }

}


/* =========================================================
   10. TAMPILKAN SEMUA DATA
========================================================= */

function tampilkanDaftar(){

    const tempat =
        document.getElementById(
            "daftarPengajuan"
        );


    if(
        !semuaPengajuan ||
        semuaPengajuan.length === 0
    ){

        tempat.innerHTML = `
            <div class="empty">

                📭 Belum ada pengajuan KUR.

            </div>
        `;

        document.getElementById(
            "detailCard"
        ).classList.remove("show");


        document.getElementById(
            "statusCard"
        ).classList.remove("show");


        return;

    }


    tempat.innerHTML =
        semuaPengajuan
        .map(
            function(p,index){

                const aktif =
                    pengajuanTerpilih &&
                    pengajuanTerpilih.id ===
                    p.id
                    ?
                    "active"
                    :
                    "";


                const status =
                    p.status ||
                    "Menunggu Verifikasi";


                return `

                    <div
                        class="list-item ${aktif}"
                        onclick="pilihPengajuan(${index})">

                        <div class="list-top">

                            <div>

                                <div class="list-name">
                                    ${escapeHTML(
                                        p.nama ||
                                        "Tanpa Nama"
                                    )}
                                </div>


                                <div class="list-number">

                                    ${escapeHTML(
                                        p.nomor_pengajuan ||
                                        "-"
                                    )}

                                </div>


                                <div class="list-date">

                                    ${formatTanggal(
                                        p.created_at
                                    )}

                                </div>

                            </div>


                            <span class="status">

                                ${escapeHTML(
                                    status
                                )}

                            </span>

                        </div>

                    </div>

                `;

            }
        )
        .join("");


    /*
     * Kalau belum ada pilihan,
     * otomatis pilih pengajuan pertama.
     */

    if(!pengajuanTerpilih){

        pilihPengajuan(0);

    }

}


/* =========================================================
   11. PILIH PENGAJUAN
========================================================= */

function pilihPengajuan(
    index
){

    const data =
        semuaPengajuan[index];


    if(!data){

        return;

    }


    pengajuanTerpilih =
        data;


    tampilkanDaftar();


    tampilkanDetail(
        data
    );


    document.getElementById(
        "detailCard"
    ).classList.add("show");


    document.getElementById(
        "statusCard"
    ).classList.add("show");


    setTimeout(
        function(){

            document.getElementById(
                "detailCard"
            ).scrollIntoView({
                behavior:"smooth",
                block:"start"
            });

        },
        100
    );

}


/* =========================================================
   12. DETAIL
========================================================= */

function tampilkanDetail(
    p
){

    const tempat =
        document.getElementById(
            "detailPengajuan"
        );


    const progress =
        Number(
            p.progress || 20
        );


    const status =
        p.status ||
        "Menunggu Verifikasi";


    tempat.innerHTML = `

        <div class="row">

            <div class="label">
                ID Pengajuan
            </div>

            <div class="value">
                ${escapeHTML(
                    p.id
                )}
            </div>

        </div>


        <div class="row">

            <div class="label">
                Nomor Pengajuan
            </div>

            <div class="value">
                ${escapeHTML(
                    p.nomor_pengajuan
                )}
            </div>

        </div>


        <div class="row">

            <div class="label">
                Tanggal Pengajuan
            </div>

            <div class="value">
                ${formatTanggal(
                    p.created_at
                )}
            </div>

        </div>


        <div class="section-mini">
            Data Pribadi
        </div>


        <div class="row">

            <div class="label">
                Nama Pemohon
            </div>

            <div class="value">
                ${escapeHTML(
                    p.nama
                )}
            </div>

        </div>


        <div class="row">

            <div class="label">
                NIK
            </div>

            <div class="value">
                ${escapeHTML(
                    p.nik
                )}
            </div>

        </div>


        <div class="row">

            <div class="label">
                Nomor HP
            </div>

            <div class="value">
                ${escapeHTML(
                    p.hp
                )}
            </div>

        </div>


        <div class="row">

            <div class="label">
                Alamat
            </div>

            <div class="value">
                ${escapeHTML(
                    p.alamat
                )}
            </div>

        </div>


        <div class="section-mini">
            Data Usaha
        </div>


        <div class="row">

            <div class="label">
                Nama Usaha
            </div>

            <div class="value">
                ${escapeHTML(
                    p.usaha
                )}
            </div>

        </div>


        <div class="row">

            <div class="label">
                Jenis Usaha
            </div>

            <div class="value">
                ${escapeHTML(
                    p.jenis_usaha
                )}
            </div>

        </div>


        <div class="row">

            <div class="label">
                Lama Usaha
            </div>

            <div class="value">
                ${escapeHTML(
                    p.lama_usaha
                )}
                Tahun
            </div>

        </div>


        <div class="row">

            <div class="label">
                Penghasilan per Bulan
            </div>

            <div class="value">
                ${formatRupiah(
                    p.penghasilan
                )}
            </div>

        </div>


        <div class="section-mini">
            Data Pinjaman
        </div>


        <div class="row">

            <div class="label">
                Jumlah Pinjaman
            </div>

            <div class="value">
                ${formatRupiah(
                    p.jumlah_pinjaman
                )}
            </div>

        </div>


        <div class="row">

            <div class="label">
                Tenor
            </div>

            <div class="value">
                ${escapeHTML(
                    p.tenor
                )}
                Bulan
            </div>

        </div>


        <div class="row">

            <div class="label">
                Status
            </div>

            <div class="value">

                <span class="status">

                    ${escapeHTML(
                        status
                    )}

                </span>

            </div>

        </div>

    `;


    tampilkanProgress(
        progress,
        status
    );

}


/* =========================================================
   13. PROGRESS
========================================================= */

function tampilkanProgress(
    progress,
    status
){

    const bar =
        document.getElementById(
            "progressBar"
        );


    bar.style.width =
        progress + "%";


    bar.innerHTML =
        progress + "%";


    document.getElementById(
        "statusInfo"
    ).innerHTML =

        "<b>Status:</b> " +
        escapeHTML(status) +

        "<br><br>" +

        "<b>Progress:</b> " +
        progress +
        "%";

}


/* =========================================================
   14. UBAH STATUS DI SUPABASE
========================================================= */

async function ubahStatus(
    progress,
    status
){

    if(!pengajuanTerpilih){

        alert(
            "Pilih pengajuan terlebih dahulu."
        );

        return;

    }


    const id =
        pengajuanTerpilih.id;


    if(!id){

        alert(
            "ID pengajuan tidak ditemukan."
        );

        return;

    }


    const yakin =
        confirm(
            "Ubah status pengajuan " +
            (
                pengajuanTerpilih
                    .nomor_pengajuan ||
                ""
            ) +
            " menjadi:\n\n" +
            status +
            " (" +
            progress +
            "%)?"
        );


    if(!yakin){

        return;

    }


    try{

        if(!supabaseClient){

            await initSupabase();

        }


        const waktu =
            new Date().toISOString();


        const hasil =
            await supabaseClient
                .from(SUPABASE_TABLE)
                .update({

                    status:
                        status,

                    progress:
                        progress,

                    updated_at:
                        waktu,

                    sudah_dicairkan:
                        progress === 100

                })
                .eq(
                    "id",
                    id
                )
                .select()
                .single();


        if(hasil.error){

            console.error(
                "UPDATE ERROR:",
                hasil.error
            );


            throw new Error(
                hasil.error.message ||
                "Gagal mengubah status."
            );

        }


        /*
         * Update objek lokal sementara.
         */

        pengajuanTerpilih =
            hasil.data;


        /*
         * Update data di array.
         */

        semuaPengajuan =
            semuaPengajuan.map(
                function(item){

                    if(
                        item.id === id
                    ){

                        return hasil.data;

                    }

                    return item;

                }
            );


        tampilkanDaftar();


        tampilkanDetail(
            hasil.data
        );


        tampilkanPesan(
            "✓ Status pengajuan berhasil diperbarui menjadi <b>" +
            escapeHTML(status) +
            "</b> (" +
            progress +
            "%).",
            "success"
        );


    }catch(error){

        console.error(
            error
        );


        tampilkanPesan(
            "❌ Gagal mengubah status.<br><br>" +
            escapeHTML(error.message),
            "error"
        );

    }

}


/* =========================================================

async function mulai(){

    try{

        await initSupabase();

        await muatSemuaPengajuan();

    }catch(error){

        console.error(
            error
        );


        document.getElementById(
            "daftarPengajuan"
        ).innerHTML = `

            <div class="empty">

                ❌ Supabase gagal terhubung.<br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


mulai();
