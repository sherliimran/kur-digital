<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#0057B8">

<title>Pengajuan KUR - Admin</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f1f5f9;
    color:#1f2937;
}


/* =========================
   HEADER
========================= */

.header{
    background:#0057B8;
    color:white;
    padding:20px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1000px;
    margin:auto;
}

.header h1{
    margin:0;
    font-size:24px;
}

.header p{
    margin:6px 0 0;
    font-size:13px;
    opacity:.9;
}


/* =========================
   CONTAINER
========================= */

.container{
    max-width:1000px;
    margin:auto;
    padding:18px 14px 50px;
}


/* =========================
   CARD
========================= */

.card{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.title{
    margin:0 0 15px;
    color:#0057B8;
    font-size:19px;
}


/* =========================
   TOP BAR
========================= */

.topbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:200px;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:14px;
    outline:none;
}

.search:focus{
    border-color:#0057B8;
}

.btn{
    border:0;
    border-radius:10px;
    padding:12px 15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-refresh{
    background:#0057B8;
    color:white;
}

.btn-back{
    background:#555;
    color:white;
}


/* =========================
   MESSAGE
========================= */

.message{
    display:none;
    padding:13px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:13px;
    line-height:1.5;
}

.error{
    background:#fee2e2;
    border:1px solid #fecaca;
    color:#991b1b;
}

.success{
    background:#dcfce7;
    border:1px solid #bbf7d0;
    color:#166534;
}


/* =========================
   STATISTIK
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.stat{
    background:#f8fafc;
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.stat-number{
    font-size:24px;
    font-weight:bold;
    color:#0057B8;
}

.stat-label{
    font-size:12px;
    color:#64748b;
    margin-top:5px;
}


/* =========================
   DAFTAR
========================= */

.list-item{
    border:1px solid #e2e8f0;
    border-radius:13px;
    padding:15px;
    margin-bottom:10px;
    cursor:pointer;
    transition:.2s;
}

.list-item:hover{
    border-color:#0057B8;
    box-shadow:0 3px 10px rgba(0,87,184,.1);
}

.list-item.active{
    border:2px solid #0057B8;
    background:#f8fbff;
}

.list-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
}

.list-name{
    font-weight:bold;
    font-size:16px;
}

.list-number{
    color:#0057B8;
    font-size:12px;
    margin-top:4px;
}

.list-date{
    font-size:11px;
    color:#64748b;
    margin-top:7px;
}

.status{
    display:inline-block;
    padding:7px 10px;
    border-radius:20px;
    background:#fef3c7;
    color:#92400e;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}


/* =========================
   DETAIL
========================= */

.detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.detail{
    background:#f8fafc;
    border-radius:10px;
    padding:12px;
}

.detail-label{
    color:#64748b;
    font-size:11px;
    margin-bottom:5px;
}

.detail-value{
    font-weight:bold;
    font-size:14px;
    word-break:break-word;
}


/* =========================
   PROGRESS
========================= */

.progress-bg{
    width:100%;
    height:22px;
    background:#e5e7eb;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#0057B8;
    color:white;
    text-align:center;
    line-height:22px;
    font-size:11px;
    transition:.3s;
}


/* =========================
   STATUS BUTTON
========================= */

.status-buttons{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.status-btn{
    border:0;
    border-radius:11px;
    padding:13px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.btn20{
    background:#64748b;
}

.btn40{
    background:#0057B8;
}

.btn60{
    background:#f59e0b;
}

.btn80{
    background:#7c3aed;
}

.btn100{
    background:#16a34a;
}

.btn0{
    background:#dc2626;
}


/* =========================
   EMPTY / LOADING
========================= */

.empty{
    text-align:center;
    color:#64748b;
    padding:30px 10px;
}

.loading{
    text-align:center;
    padding:30px;
    color:#64748b;
}


/* =========================
   INFO
========================= */

.info{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    color:#1e40af;
    border-radius:10px;
    padding:13px;
    font-size:12px;
    line-height:1.5;
    margin-top:15px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .status-buttons{
        grid-template-columns:1fr;
    }

    .list-head{
        flex-direction:column;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="header-inner">

        <h1>
            Pengajuan KUR
        </h1>

        <p>
            Panel Admin KUR Digital
        </p>

    </div>

</header>



<main class="container">


<!-- =====================================================
     PESAN
===================================================== -->

<div
    id="pesanError"
    class="message error">
</div>


<div
    id="pesanSukses"
    class="message success">
</div>



<!-- =====================================================
     STATISTIK
===================================================== -->

<section class="card">

    <h2 class="title">
        Ringkasan Pengajuan
    </h2>

    <div class="stats">

        <div class="stat">

            <div
                class="stat-number"
                id="totalPengajuan">
                0
            </div>

            <div class="stat-label">
                Total
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="menunggu">
                0
            </div>

            <div class="stat-label">
                Menunggu
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="diproses">
                0
            </div>

            <div class="stat-label">
                Diproses
            </div>

        </div>


        <div class="stat">

            <div
                class="stat-number"
                id="selesai">
                0
            </div>

            <div class="stat-label">
                Selesai
            </div>

        </div>

    </div>

</section>



<!-- =====================================================
     DAFTAR PENGAJUAN
===================================================== -->

<section class="card">

    <div class="topbar">

        <input
            type="text"
            id="searchInput"
            class="search"
            placeholder="Cari nama, NIK, nomor pengajuan..."
            oninput="filterPengajuan()"
        >


        <button
            class="btn btn-refresh"
            onclick="ambilSemuaPengajuan()">

            ↻ Refresh

        </button>

    </div>

</section>



<section class="card">

    <h2 class="title">
        Semua Pengajuan
    </h2>


    <div
        id="daftarPengajuan">

        <div class="loading">
            Memuat data dari Supabase...
        </div>

    </div>

</section>



<!-- =====================================================
     DETAIL PENGAJUAN
===================================================== -->

<section
    class="card"
    id="detailCard"
    style="display:none;">

    <h2 class="title">
        Detail Pengajuan
    </h2>


    <div
        id="detailPengajuan">
    </div>


    <div class="info">

        Data pada halaman ini dibaca langsung dari
        tabel <b>pengajuan</b> Supabase.

    </div>

</section>



<!-- =====================================================
     PROGRESS
===================================================== -->

<section
    class="card"
    id="progressCard"
    style="display:none;">

    <h2 class="title">
        Progress Pengajuan
    </h2>


    <div class="progress-bg">

        <div
            class="progress-bar"
            id="progressBar">

            0%

        </div>

    </div>


    <p id="statusText">
        Menunggu...

    </p>

</section>



<!-- =====================================================
     UPDATE STATUS
===================================================== -->

<section
    class="card"
    id="statusCard"
    style="display:none;">

    <h2 class="title">
        Update Status
    </h2>


    <div class="status-buttons">


        <button
            class="status-btn btn20"
            onclick="ubahStatus(20,'Menunggu Verifikasi')">

            20%<br>
            Menunggu Verifikasi

        </button>


        <button
            class="status-btn btn40"
            onclick="ubahStatus(40,'Verifikasi Dokumen')">

            40%<br>
            Verifikasi Dokumen

        </button>


        <button
            class="status-btn btn60"
            onclick="ubahStatus(60,'Survey Lapangan')">

            60%<br>
            Survey Lapangan

        </button>


        <button
            class="status-btn btn80"
            onclick="ubahStatus(80,'Persetujuan Kredit')">

            80%<br>
            Persetujuan Kredit

        </button>


        <button
            class="status-btn btn100"
            onclick="ubahStatus(100,'Dana Dicairkan')">

            100%<br>
            Dana Dicairkan

        </button>


        <button
            class="status-btn btn0"
            onclick="ubahStatus(0,'Pengajuan Ditolak')">

            ✕<br>
            Tolak Pengajuan

        </button>


    </div>

</section>



<!-- =====================================================
     NAVIGASI
===================================================== -->

<section class="card">

    <button
        class="btn btn-back"
        style="width:100%;"
        onclick="window.location.href='dashboard.html'">

        ← Kembali ke Dashboard Admin

    </button>

</section>


</main>



<script>

/* =========================================================
   KONFIGURASI SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://binojniwitsdhnhqmneq.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_yX4gQ30MAXnmrVAUIL1bZQ_f6E1hnNV";


const SUPABASE_TABLE =
    "pengajuan";


/* =========================================================
   VARIABEL
========================================================= */

let supabaseClient = null;

let semuaPengajuan = [];

let pengajuanTerpilih = null;


/* =========================================================
   LOAD SUPABASE
========================================================= */

function loadSupabaseLibrary(){

    return new Promise(
        function(resolve,reject){

            if(
                window.supabase &&
                typeof window.supabase.createClient ===
                "function"
            ){

                resolve();

                return;

            }


            const script =
                document.createElement("script");


            script.src =
                "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";


            script.onload =
                function(){

                    if(
                        window.supabase &&
                        typeof window.supabase.createClient ===
                        "function"
                    ){

                        resolve();

                    }else{

                        reject(
                            new Error(
                                "Library Supabase gagal dimuat."
                            )
                        );

                    }

                };


            script.onerror =
                function(){

                    reject(
                        new Error(
                            "Tidak dapat memuat library Supabase."
                        )
                    );

                };


            document.head.appendChild(script);

        }
    );

}


/* =========================================================
   INIT
========================================================= */

async function initSupabase(){

    try{

        await loadSupabaseLibrary();


        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        console.log(
            "Supabase admin siap."
        );


        return true;

    }catch(error){

        tampilkanError(
            error.message
        );


        return false;

    }

}


/* =========================================================
   ERROR
========================================================= */

function tampilkanError(pesan){

    const box =
        document.getElementById(
            "pesanError"
        );


    const sukses =
        document.getElementById(
            "pesanSukses"
        );


    if(sukses){

        sukses.style.display =
            "none";

    }


    box.innerHTML =
        "⚠️ " + pesan;


    box.style.display =
        "block";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   SUKSES
========================================================= */

function tampilkanSukses(pesan){

    const box =
        document.getElementById(
            "pesanSukses"
        );


    const error =
        document.getElementById(
            "pesanError"
        );


    if(error){

        error.style.display =
            "none";

    }


    box.innerHTML =
        "✓ " + pesan;


    box.style.display =
        "block";

}


/* =========================================================
   FORMAT RUPIAH
========================================================= */

function rupiah(nilai){

    return "Rp " +
        Number(
            nilai || 0
        ).toLocaleString("id-ID");

}


/* =========================================================
   FORMAT TANGGAL
========================================================= */

function formatTanggal(tanggal){

    if(!tanggal){

        return "-";

    }


    try{

        return new Date(
            tanggal
        ).toLocaleString(
            "id-ID"
        );

    }catch(error){

        return tanggal;

    }

}


/* =========================================================
   AMBIL SEMUA PENGAJUAN DARI SUPABASE
========================================================= */

async function ambilSemuaPengajuan(){

    const tempat =
        document.getElementById(
            "daftarPengajuan"
        );


    tempat.innerHTML = `

        <div class="loading">
            Mengambil data dari Supabase...
        </div>

    `;


    try{

        if(!supabaseClient){

            const siap =
                await initSupabase();


            if(!siap){

                return;

            }

        }


        const hasil =
            await supabaseClient
            .from(
                SUPABASE_TABLE
            )
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(hasil.error){

            throw hasil.error;

        }


        semuaPengajuan =
            hasil.data || [];


        console.log(
            "Semua data Supabase:",
            semuaPengajuan
        );


        tampilkanStatistik();


        tampilkanDaftar(
            semuaPengajuan
        );


        /*
         * Jika sebelumnya ada pengajuan
         * yang dipilih, cari lagi setelah refresh.
         */

        if(
            pengajuanTerpilih &&
            pengajuanTerpilih.id
        ){

            const terbaru =
                semuaPengajuan.find(
                    function(item){

                        return String(item.id) ===
                            String(
                                pengajuanTerpilih.id
                            );

                    }
                );


            if(terbaru){

                pilihPengajuan(
                    terbaru.id
                );

            }

        }


        if(
            semuaPengajuan.length === 0
        ){

            tampilkanSukses(
                "Belum ada data pengajuan di Supabase."
            );

        }

    }catch(error){

        console.error(
            "Gagal mengambil pengajuan:",
            error
        );


        tempat.innerHTML = `

            <div class="empty">

                Gagal mengambil data.

                <br><br>

                ${error.message || error}

            </div>

        `;


        tampilkanError(
            "Gagal membaca data Supabase: " +
            (
                error.message ||
                error
            )
        );

    }

}


/* =========================================================
   STATISTIK
========================================================= */

function tampilkanStatistik(){

    const total =
        semuaPengajuan.length;


    let menunggu = 0;

    let diproses = 0;

    let selesai = 0;


    semuaPengajuan.forEach(
        function(p){

            const progress =
                Number(
                    p.progress || 0
                );


            const status =
                String(
                    p.status || ""
                ).toLowerCase();


            if(
                progress === 20 ||
                status.includes(
                    "menunggu"
                )
            ){

                menunggu++;

            }


            if(
                progress > 20 &&
                progress < 100 &&
                progress > 0
            ){

                diproses++;

            }


            if(
                progress === 100 ||
                status.includes(
                    "dicairkan"
                )
            ){

                selesai++;

            }

        }
    );


    document.getElementById(
        "totalPengajuan"
    ).innerText =
        total;


    document.getElementById(
        "menunggu"
    ).innerText =
        menunggu;


    document.getElementById(
        "diproses"
    ).innerText =
        diproses;


    document.getElementById(
        "selesai"
    ).innerText =
        selesai;

}


/* =========================================================
   TAMPILKAN DAFTAR
========================================================= */

function tampilkanDaftar(data){

    const tempat =
        document.getElementById(
            "daftarPengajuan"
        );


    if(
        !data ||
        data.length === 0
    ){

        tempat.innerHTML = `

            <div class="empty">

                Belum ada pengajuan.

            </div>

        `;

        return;

    }


    tempat.innerHTML =
        data.map(
            function(p){

                const id =
                    p.id;


                const nomor =
                    p.nomor_pengajuan ||
                    "-";


                const nama =
                    p.nama ||
                    "-";


                const status =
                    p.status ||
                    "Menunggu Verifikasi";


                const progress =
                    Number(
                        p.progress || 0
                    );


                const active =
                    pengajuanTerpilih &&
                    String(
                        pengajuanTerpilih.id
                    ) ===
                    String(id)
                    ?
                    "active"
                    :
                    "";


                return `

                    <div
                        class="list-item ${active}"
                        onclick="pilihPengajuan('${id}')"
                    >

                        <div class="list-head">

                            <div>

                                <div class="list-name">

                                    ${escapeHTML(
                                        nama
                                    )}

                                </div>

                                <div class="list-number">

                                    ${escapeHTML(
                                        nomor
                                    )}

                                </div>

                            </div>


                            <span class="status">

                                ${escapeHTML(
                                    status
                                )}

                            </span>

                        </div>


                        <div class="list-date">

                            ${formatTanggal(
                                p.created_at
                            )}

                            &nbsp; • &nbsp;

                            Progress ${progress}%

                        </div>

                    </div>

                `;

            }
        )
        .join("");

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   PILIH PENGAJUAN
========================================================= */

function pilihPengajuan(id){

    const data =
        semuaPengajuan.find(
            function(item){

                return String(
                    item.id
                ) ===
                String(id);

            }
        );


    if(!data){

        tampilkanError(
            "Data pengajuan tidak ditemukan."
        );

        return;

    }


    pengajuanTerpilih =
        data;


    tampilkanDaftar(
        semuaPengajuan.filter(
            function(item){

                return true;

            }
        )
    );


    tampilkanDetail(
        data
    );


    document.getElementById(
        "detailCard"
    ).style.display =
        "block";


    document.getElementById(
        "progressCard"
    ).style.display =
        "block";


    document.getElementById(
        "statusCard"
    ).style.display =
        "block";


    window.scrollTo({
        top:
            document.getElementById(
                "detailCard"
            ).offsetTop - 20,
        behavior:"smooth"
    });

}


/* =========================================================
   TAMPILKAN DETAIL
========================================================= */

function tampilkanDetail(p){

    const tempat =
        document.getElementById(
            "detailPengajuan"
        );


    const progress =
        Number(
            p.progress || 0
        );


    const status =
        p.status ||
        "Menunggu Verifikasi";


    tempat.innerHTML = `

        <div class="detail-grid">


            <div class="detail">

                <div class="detail-label">
                    ID
                </div>

                <div class="detail-value">
                    ${escapeHTML(
                        p.id || "-"
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Nomor Pengajuan
                </div>

                <div class="detail-value">
                    ${escapeHTML(
                        p.nomor_pengajuan || "-"
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Nama Lengkap
                </div>

                <div class="detail-value">
                    ${escapeHTML(
                        p.nama || "-"
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    NIK
                </div>

                <div class="detail-value">
                    ${escapeHTML(
                        p.nik || "-"
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Nomor HP
                </div>

                <div class="detail-value">
                    ${escapeHTML(
                        p.hp || "-"
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Alamat
                </div>

                <div class="detail-value">
                    ${escapeHTML(
                        p.alamat || "-"
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Nama Bank
                </div>

                <div class="detail-value">
                    ${escapeHTML(
                        p.nama_bank ||
                        p.bank ||
                        p.namaBank ||
                        "-"
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Nomor Rekening
                </div>

                <div class="detail-value">
                    ${escapeHTML(

/* =========================================================
   PROGRESS
========================================================= */

function tampilkanProgress(
    progress,
    status
){

    const bar =
        document.getElementById(
            "progressBar"
        );


    bar.style.width =
        progress + "%";


    bar.innerText =
        progress + "%";


    document.getElementById(
        "statusText"
    ).innerHTML =

        "<b>Status:</b> " +
        escapeHTML(
            status
        ) +

        "<br><br>" +

        "<b>Progress:</b> " +
        progress +
        "%";

}


/* =========================================================
   UPDATE STATUS SUPABASE
========================================================= */

async function ubahStatus(
    progressBaru,
    statusBaru
){

    if(
        !pengajuanTerpilih
    ){

        tampilkanError(
            "Pilih pengajuan terlebih dahulu."
        );

        return;

    }


    const id =
        pengajuanTerpilih.id;


    const yakin =
        confirm(

            "Ubah status pengajuan:\n\n" +

            (
                pengajuanTerpilih.nama ||
                "-"
            ) +

            "\n\nMenjadi:\n" +

            statusBaru +

            "\nProgress: " +

            progressBaru +

            "%"

        );


    if(!yakin){

        return;

    }


    try{

        if(!supabaseClient){

            const siap =
                await initSupabase();


            if(!siap){

                return;

            }

        }


        /*
         * Jika 100%, tandai sudah dicairkan.
         */

        const sudahDicairkan =
            progressBaru === 100;


        const updateData = {

            status:
                statusBaru,

            progress:
                progressBaru,

            sudah_dicairkan:
                sudahDicairkan,

            updated_at:
                new Date().toISOString()

        };


        console.log(
            "Update Supabase:",
            id,
            updateData
        );


        const hasil =
            await supabaseClient
            .from(
                SUPABASE_TABLE
            )
            .update(
                updateData
            )
            .eq(
                "id",
                id
            )
            .select()
            .single();


        if(hasil.error){

            throw hasil.error;

        }


        /*
         * Update object lokal di memori.
         */

        pengajuanTerpilih =
            hasil.data;


        const index =
            semuaPengajuan.findIndex(
                function(item){

                    return String(
                        item.id
                    ) ===
                    String(id);

                }
            );


        if(index !== -1){

            semuaPengajuan[index] =
                hasil.data;

        }


        tampilkanStatistik();


        tampilkanDaftar(
            semuaPengajuan
        );


        tampilkanDetail(
            hasil.data
        );


        tampilkanSukses(

            "Status pengajuan berhasil diperbarui ke Supabase.<br>" +

            "<b>" +
            escapeHTML(
                statusBaru
            ) +
            "</b> — " +

            progressBaru +
            "%"

        );


        console.log(
            "Update berhasil:",
            hasil.data
        );


    }catch(error){

        console.error(
            "Gagal update status:",
            error
        );


        tampilkanError(

            "Gagal memperbarui status Supabase.<br><br>" +

            (
                error.message ||
                error
            )

        );

    }

}


/* =========================================================
   SEARCH
========================================================= */

function filterPengajuan(){

    const keyword =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    if(!keyword){

        tampilkanDaftar(
            semuaPengajuan
        );

        return;

    }


    const hasil =
        semuaPengajuan.filter(
            function(p){

                const teks = [

                    p.nama,

                    p.nik,

                    p.hp,

                    p.nomor_pengajuan,

                    p.usaha,

                    p.status,

                    p.nama_bank,

                    p.bank,

                    p.nomor_rekening,

                    p.rekening

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                return teks.includes(
                    keyword
                );

            }
        );


    tampilkanDaftar(
        hasil
    );

}


/* =========================================================
   START
========================================================= */

async function mulai(){

    console.log(
        "Admin Pengajuan dimulai..."
    );


    /*
     * Pastikan login admin.
     */

    if(
        localStorage.getItem(
            "adminLogin"
        ) !== "true"
    ){

        /*
         * Jika sistem login admin
         * memang memakai localStorage.
         */

        window.location.href =
            "login.html";

        return;

    }


    const siap =
        await initSupabase();


    if(!siap){

        return;

    }


    await ambilSemuaPengajuan();

}


/* =========================================================
   JALANKAN
========================================================= */

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        mulai
    );

}else{

    mulai();

}
