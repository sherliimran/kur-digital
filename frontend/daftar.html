<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daftar Akun - KUR Digital</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

<img src="img/logo.png" alt="Logo" width="90">

<h1>KUR Digital</h1>

<p>Daftar Akun Baru</p>

<input
type="text"
id="nama"
placeholder="Nama Lengkap">

<input
type="email"
id="email"
placeholder="Email">

<input
type="tel"
id="hp"
placeholder="Nomor HP">

<input
type="password"
id="password"
placeholder="Password">

<input
type="password"
id="konfirmasi"
placeholder="Konfirmasi Password">

<button onclick="daftar()">
DAFTAR
</button>

<p>
Sudah punya akun?
<a href="login.html">
Masuk
</a>
</p>

</div>

<script src="js/app.js"></script>

</body>
</html>
