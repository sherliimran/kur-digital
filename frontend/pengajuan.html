/* =========================================================
   4. LOAD SUPABASE JS
   ========================================================= */

function loadSupabaseLibrary(){

    return new Promise(function(resolve, reject){

        /*
         * Jika sudah ada, tidak perlu load lagi
         */

        if(
            window.supabase &&
            typeof window.supabase.createClient === "function"
        ){

            resolve();

            return;

        }


        const script =
            document.createElement("script");


        script.src =
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";


        script.onload =
            function(){

                if(
                    window.supabase &&
                    typeof window.supabase.createClient === "function"
                ){

                    resolve();

                }else{

                    reject(
                        new Error(
                            "Library Supabase tidak berhasil dimuat."
                        )
                    );

                }

            };


        script.onerror =
            function(){

                reject(
                    new Error(
                        "Tidak dapat memuat library Supabase."
                    )
                );

            };


        document.head.appendChild(script);

    });

}


/* =========================================================
   5. INISIALISASI SUPABASE
   ========================================================= */

async function initSupabase(){

    try{

        /*
         * Cek konfigurasi
         */

        if(
            !SUPABASE_URL ||
            SUPABASE_URL === "ISI_URL_SUPABASE_KAMU"
        ){

            console.warn(
                "SUPABASE_URL belum diisi."
            );

            return false;

        }


        if(
            !SUPABASE_PUBLISHABLE_KEY ||
            SUPABASE_PUBLISHABLE_KEY ===
            "ISI_PUBLISHABLE_KEY_KAMU"
        ){

            console.warn(
                "SUPABASE_PUBLISHABLE_KEY belum diisi."
            );

            return false;

        }


        /*
         * Load library
         */

        await loadSupabaseLibrary();


        /*
         * Buat client
         */

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        supabaseSiap = true;


        console.log(
            "✓ Supabase berhasil terhubung."
        );


        return true;

    }catch(error){

        console.error(
            "Gagal inisialisasi Supabase:",
            error
        );


        supabaseSiap = false;


        return false;

    }

}

/* =========================================================
   10. BUAT UUID
   ========================================================= */

function buatUUID(){

    /*
     * Browser modern
     */

    if(
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
    ){

        return window.crypto.randomUUID();

    }


    /*
     * Fallback
     */

    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
        .replace(
            /[xy]/g,
            function(c){

                const r =
                    Math.random() * 16 | 0;

                const v =
                    c === "x"
                    ?
                    r
                    :
                    (r & 0x3 | 0x8);


                return v.toString(16);

            }
        );

}


/* =========================================================
   11. BUAT NOMOR PENGAJUAN
   ========================================================= */

function buatNomorPengajuan(){

    const sekarang =
        new Date();


    const tahun =
        sekarang.getFullYear();


    const bulan =
        String(
            sekarang.getMonth() + 1
        ).padStart(2,"0");


    const tanggal =
        String(
            sekarang.getDate()
        ).padStart(2,"0");


    const jam =
        String(
            sekarang.getHours()
        ).padStart(2,"0");


    const menit =
        String(
            sekarang.getMinutes()
        ).padStart(2,"0");


    const detik =
        String(
            sekarang.getSeconds()
        ).padStart(2,"0");


    const acak =
        Math.floor(
            100 +
            Math.random() * 900
        );


    return (
        "KUR-" +
        tahun +
        bulan +
        tanggal +
        "-" +
        jam +
        menit +
        detik +
        acak
    );

}

function rekeningValid(nomor){

/* =========================================================
   14. SIMPAN KE SUPABASE
   ========================================================= */

async function simpanKeSupabase(formData){

    /*
     * Pastikan Supabase siap
     */

    if(!supabaseSiap){

        const berhasil =
            await initSupabase();


        if(!berhasil){

            throw new Error(
                "Supabase belum terhubung. Periksa URL dan Publishable Key."
            );

        }

    }


    /*
     * Nomor pengajuan baru
     */

    const nomorPengajuan =
        buatNomorPengajuan();


    /*
     * UUID baru
     */

    const id =
        buatUUID();


    /*
     * Timestamp
     */

    const sekarang =
        new Date()
        .toISOString();


    /*
     * DATA YANG DIKIRIM KE TABEL
     *
     * Nama kolom disesuaikan dengan
     * struktur tabel yang kamu kirim.
     */

    const dataDatabase = {

        id:
            id,

        nomor_pengajuan:
            nomorPengajuan,

        nama:
            formData.nama,

        nik:
            formData.nik,

        hp:
            formData.hp,

        alamat:
            formData.alamat,

        usaha:
            formData.usaha,

        jenis_usaha:
            formData.jenisUsaha,

        /*
         * Di database:
         * lama_usaha = TEXT
         */

        lama_usaha:
            String(
                formData.lamaUsaha
            ),

        /*
         * Di database:
         * penghasilan = NUMERIC
         */

        penghasilan:
            Number(
                formData.penghasilan
            ),

        /*
         * Kolom ini ada di database,
         * tetapi form sekarang belum memiliki
         * pilihan jenis pinjaman.
         *
         * Karena kolom nullable, kita kosongkan.
         */

        jenis_pinjaman:
            null,

        /*
         * Di database:
         * jumlah_pinjaman = NUMERIC
         */

        jumlah_pinjaman:
            Number(
                formData.pinjaman
            ),

        /*
         * Form berisi:
         * "12 Bulan", "24 Bulan", dst.
         *
         * Database:
         * tenor = INTEGER
         *
         * Jadi diubah menjadi 12, 24, dst.
         */

        tenor:
            parseInt(
                formData.tenor,
                10
            ),

        /*
         * Status awal
         */

        status:
            "Menunggu Verifikasi",

        /*
         * Progress awal
         */

        progress:
            20,

        /*
         * Belum dicairkan
         */

        sudah_dicairkan:
            false,

        /*
         * Timestamp
         */

        created_at:
            sekarang,

        updated_at:
            sekarang

    };


    console.log(
        "Data yang dikirim ke Supabase:",
        dataDatabase
    );


    /*
     * INSERT
     */

    const hasil =
        await supabaseClient
        .from(
            SUPABASE_TABLE
        )
        .insert(
            dataDatabase
        )
        .select()
        .single();


    /*
     * Cek error
     */

    if(hasil.error){

        console.error(
            "Supabase INSERT ERROR:",
            hasil.error
        );


        throw new Error(
            hasil.error.message ||
            "Gagal menyimpan pengajuan ke Supabase."
        );

    }


    /*
     * Kembalikan hasil
     */

    return {

        data:
            hasil.data,

        nomorPengajuan:
            nomorPengajuan

    };

}

/* =========================================================
   16. KIRIM PENGAJUAN
   ========================================================= */

async function kirimPengajuan(){

    /*
     * Cegah klik berkali-kali
     */

    const tombol =
        document.querySelector(
            'button[onclick="kirimPengajuan()"]'
        );


    if(
        tombol &&
        tombol.disabled
    ){

        return;

    }


    /*
     * Validasi
     */

    const formData =
        ambilDanValidasiForm();


    if(!formData){

        return;

    }


    /*
     * Disable tombol
     */

    if(tombol){

        tombol.disabled =
            true;

        tombol.dataset.text =
            tombol.innerText;

        tombol.innerText =
            "Mengirim Pengajuan...";

        tombol.style.opacity =
            "0.7";

    }


    try{

        /*
         * Tampilkan proses
         */

        tampilkanSukses(
            "Sedang mengirim pengajuan..."
        );


        /*
         * Kirim ke Supabase
         */

        const hasil =
            await simpanKeSupabase(
                formData
            );


        /*
         * Setelah Supabase sukses,
         * baru simpan localStorage.
         */

        simpanDataLokal(
            formData,
            hasil
        );


        /*
         * Kosongkan file input.
         */

        const ktp =
            document.getElementById(
                "ktp"
            );


        const selfie =
            document.getElementById(
                "selfie"
            );


        const usahaFoto =
            document.getElementById(
                "usahaFoto"
            );


        if(ktp){

            ktp.value =
                "";

        }


        if(selfie){

            selfie.value =
                "";

        }


        if(usahaFoto){

            usahaFoto.value =
                "";

        }


        /*
         * Pesan berhasil
         */

        tampilkanSukses(
            "Pengajuan berhasil dikirim. " +
            "Nomor Pengajuan: " +
            hasil.nomorPengajuan
        );


        /*
         * Tunggu sebentar,
         * lalu kembali ke dashboard.
         */

        setTimeout(
            function(){

                window.location.href =
                    "dashboard.html";

            },
            1800
        );


    }catch(error){

        console.error(
            "Gagal mengirim pengajuan:",
            error
        );


        /*
         * Tampilkan error yang sebenarnya
         */

        tampilkanError(
            "Pengajuan gagal dikirim ke server. " +
            error.message
        );


        /*
         * Aktifkan tombol kembali
         */

        if(tombol){

            tombol.disabled =
                false;

            tombol.innerText =
                tombol.dataset.text ||
                "Ajukan Sekarang";

            tombol.style.opacity =
                "1";

        }

    }

}
